<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import pliku — Analizator logów</title>
<style>
:root {color-scheme:dark;font:16px/1.55 system-ui,sans-serif;color:#f1f5f9;background:#0f172a}
body {max-width:780px;margin:0 auto;padding:24px;box-sizing:border-box}
h1 {font-size:1.5rem;margin:0 0 8px} p {margin:8px 0 18px;color:#cbd5e1}
form {display:grid;gap:16px} label {display:grid;gap:6px} .row {display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,select,button {font:inherit;color:inherit;background:#1e293b;border:1px solid #64748b;border-radius:8px;padding:10px;min-width:0}
button {cursor:pointer;background:#38bdf8;color:#0f172a;font-weight:650} button:disabled {opacity:.55;cursor:wait}
button.secondary {background:#1e293b;color:#f1f5f9} #status {white-space:pre-wrap} #status.error {color:#fca5a5}
a {color:#38bdf8} progress {width:100%;accent-color:#38bdf8} small {color:#94a3b8}
[hidden] {display:none!important} @media(max-width:520px) {.row {grid-template-columns:1fr} body {padding:16px}}
</style>
<h1>Import pliku</h1>
<p>Plik UTF-8 .log lub .txt, do 2 GB (2048 MiB) i __MAX_LINES__ niepustych wpisów.
Pojedynczy wpis: do 10 000 znaków. Wszystkie limity obowiązują jednocześnie.</p>
<form id="upload">
  <label>Plik z logami<input id="file" type="file" accept=".log,.txt" required></label>
  <div class="row">
    <label>Format logów<select id="format"><option value="hdfs">HDFS</option><option value="ssh">SSH / auth.log</option></select></label>
    <label>Kompletność danych<select id="scope"><option value="unknown">Nie ustalono</option><option value="sample">Próbka danych</option><option value="complete">Deklaruję pełny zapis</option></select></label>
  </div>
  <div class="row">
    <label>Strefa czasowa źródła — opcjonalnie<input id="zone" placeholder="Europe/Warsaw lub UTC" maxlength="100"></label>
    <label>Rok dla SSH bez roku — opcjonalnie<input id="year" type="number" min="1900" max="2100" step="1" placeholder="np. 2026"></label>
  </div>
  <small>Podaj strefę źródła tylko wtedy, gdy ją znasz. Jawna strefa w logu ma pierwszeństwo.</small>
  <button id="submit" type="submit">Prześlij i przeanalizuj</button>
  <button id="cancel" class="secondary" type="button" hidden>Przerwij przesyłanie</button>
</form>
<progress id="progress" max="100" value="0" hidden aria-label="Postęp przesyłania"></progress>
<p id="status" role="status" aria-live="polite"></p>
<a id="result" href="#" target="_blank" rel="noopener" hidden>Otwórz wynik analizy w dashboardzie →</a>
<script>
const dashboardURL = __DASHBOARD_URL__;
const maxBytes = __MAX_BYTES__;
const byId = id => document.getElementById(id);
let activeRequest = null;
function status(message, error = false) {
  byId('status').textContent = message;
  byId('status').className = error ? 'error' : '';
}
function finished() {
  activeRequest = null;
  byId('submit').disabled = false;
  byId('cancel').hidden = true;
  byId('progress').hidden = true;
}
byId('cancel').onclick = () => activeRequest?.abort();
byId('upload').onsubmit = event => {
  event.preventDefault();
  const file = byId('file').files[0];
  byId('result').hidden = true;
  if (!file || file.size === 0) return status('Wybierz niepusty plik z logami.', true);
  if (file.size > maxBytes) return status('Plik może mieć maksymalnie 2 GB (2048 MiB).', true);
  const params = new URLSearchParams({log_format: byId('format').value, data_scope: byId('scope').value});
  if (byId('zone').value.trim()) params.set('source_timezone', byId('zone').value.trim());
  if (byId('year').value) params.set('source_year', byId('year').value);
  const xhr = new XMLHttpRequest();
  activeRequest = xhr;
  byId('submit').disabled = true;
  byId('cancel').hidden = false;
  byId('progress').value = 0;
  byId('progress').hidden = false;
  status('Przesyłanie pliku…');
  xhr.open('POST', '/api/v1/analyze/file?' + params);
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');
  xhr.timeout = 30 * 60 * 1000;
  xhr.upload.onprogress = event => {
    if (event.lengthComputable) byId('progress').value = event.loaded / event.total * 100;
  };
  xhr.upload.onload = () => {
    byId('progress').value = 100;
    byId('cancel').hidden = true;
    status('Plik przesłany. Trwa sprawdzanie i zapisywanie analizy…');
  };
  xhr.onload = () => {
    finished();
    let data;
    try { data = JSON.parse(xhr.responseText); }
    catch { return status('Nie można odczytać odpowiedzi API. Spróbuj ponownie.', true); }
    if (xhr.status < 200 || xhr.status >= 300) {
      return status(typeof data.detail === 'string' ? data.detail : 'Sprawdź ustawienia źródła i format pliku.', true);
    }
    if (!data.analysis_id) return status('API nie zwróciło identyfikatora analizy.', true);
    const url = new URL(dashboardURL);
    url.searchParams.set('view', 'analysis');
    url.searchParams.set('analysis_id', data.analysis_id);
    byId('result').href = url.toString();
    byId('result').hidden = false;
    status(`Zapisano analizę. Zdarzenia: ${data.event_count}. Wykrycia: ${data.finding_count}.`);
  };
  xhr.onerror = () => { finished(); status('Nie można połączyć się z API. Sprawdź, czy jest uruchomione.', true); };
  xhr.ontimeout = () => { finished(); status('Przekroczono czas przesyłania. Wynik mógł zostać zapisany — sprawdź API przed ponowieniem.', true); };
  xhr.onabort = () => { finished(); status('Przesyłanie przerwano.'); };
  // Obiekt File jest wysyłany bez odczytu całej zawartości do tekstu w JavaScript.
  xhr.send(file);
};
</script>
</html>
